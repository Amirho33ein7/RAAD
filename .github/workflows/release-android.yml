name: Publish RAAD Android Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.3.0"
        required: true
        default: "v0.4.6"
        type: string
  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: آماده‌سازی Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: آماده‌سازی Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تولید پروژه Android
        working-directory: app
        run: flutter create --platforms=android --org com.raad.mobile --project-name raad .

      - name: تنظیم مجوزهای ذخیره‌سازی
        working-directory: app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '',
          ]
          for permission in permissions:
              if permission not in source:
                  source = source.replace("<application", "    " + permission + "\n\n    <application", 1)
          source = source.replace(' android:requestLegacyExternalStorage="true"', "")
          manifest.write_text(source, encoding="utf-8")
          PY

      - name: Install Android Download/RAAD file writer
        working-directory: app
        shell: bash
        run: |
          cat > /tmp/raad-main-activity.kt <<'KOTLIN'
          package __RAAD_PACKAGE__
          
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.DocumentsContract
          import android.database.Cursor
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodCall
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.IOException
          import java.io.InputStream
          
          class MainActivity : FlutterActivity() {
              private val channelName = "raad/file_storage"
              private var pendingFolderResult: MethodChannel.Result? = null
          
              private val storagePrefs by lazy {
                  getSharedPreferences("raad_file_storage", MODE_PRIVATE)
              }
          
              companion object {
                  private const val PICK_FOLDER_REQUEST = 9652
                  private const val BACKUP_FILE_NAME = "raad_profile_backup.json"
                  private const val RAAD_FOLDER_NAME = "RAAD"
              }
          
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "ensureAccess" -> ensureAccess(result)
                              "saveVideo" -> saveVideo(call, result)
                              "deleteSavedVideo" -> deleteSavedVideo(call, result)
                              "readBackup" -> readBackup(result)
                              "writeBackup" -> writeBackup(call, result)
                              "restoreVideoToPrivate" -> restoreVideoToPrivate(call, result)
                              else -> result.notImplemented()
                          }
                      }
              }
          
              private fun persistedTreeUri(): Uri? {
                  val raw = storagePrefs.getString("treeUri", null) ?: return null
                  val uri = Uri.parse(raw)
                  val grant = contentResolver.persistedUriPermissions.firstOrNull {
                      it.uri == uri && it.isWritePermission
                  } ?: return null
                  if (!grant.isReadPermission || !grant.isWritePermission) return null
                  return uri
              }
          
              private fun selectedFolderUri(): Uri? {
                  val treeUri = persistedTreeUri() ?: return null
                  val documentId = storagePrefs.getString("folderDocumentId", null)
                      ?: DocumentsContract.getTreeDocumentId(treeUri)
                  return DocumentsContract.buildDocumentUriUsingTree(treeUri, documentId)
              }
          
              private fun ensureAccess(result: MethodChannel.Result) {
                  // Force one fresh, visible folder grant after upgrading from the
                  // older non-verifying storage implementation. This avoids silently
                  // trusting a stale folder selection from the previous APK.
                  if (storagePrefs.getInt("folderSetupVersion", 0) < 2) {
                      storagePrefs.edit()
                          .remove("treeUri")
                          .remove("folderDocumentId")
                          .remove("folderDisplayName")
                          .putInt("folderSetupVersion", 2)
                          .apply()
                  }
                  val treeUri = persistedTreeUri()
                  val folderUri = selectedFolderUri()
                  if (treeUri != null && folderUri != null) {
                      try {
                          // A stored URI alone is not proof that the provider still permits writes.
                          verifyFolderWritable(folderUri)
                          val name = storagePrefs.getString("folderDisplayName", "RAAD") ?: "RAAD"
                          result.success(mapOf(
                              "granted" to true,
                              "folderName" to name,
                              "message" to "دسترسی نوشتن در پوشهٔ $name بررسی و تأیید شد."
                          ))
                          return
                      } catch (_: Exception) {
                          // Stale/revoked access must reopen Android's system folder picker.
                          storagePrefs.edit()
                              .remove("treeUri")
                              .remove("folderDocumentId")
                              .remove("folderDisplayName")
                              .apply()
                      }
                  }

                  if (pendingFolderResult != null) {
                      result.error("folder_picker_in_progress", "انتخاب پوشه در حال انجام است.", null)
                      return
                  }
          
                  pendingFolderResult = result
                  try {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                          addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION or
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION or
                              Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                          )
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              val documentsUri = DocumentsContract.buildTreeDocumentUri(
                                  "com.android.externalstorage.documents",
                                  "primary:Documents"
                              )
                              putExtra(DocumentsContract.EXTRA_INITIAL_URI, documentsUri)
                          }
                      }
                      startActivityForResult(intent, PICK_FOLDER_REQUEST)
                  } catch (error: Exception) {
                      val pending = pendingFolderResult
                      pendingFolderResult = null
                      pending?.error(
                          "folder_picker_failed",
                          error.message ?: "بازکردن انتخاب‌گر پوشه ناموفق بود.",
                          null
                      )
                  }
              }
          
              @Deprecated("The FlutterActivity result callback is used for the system folder picker.")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != PICK_FOLDER_REQUEST) return
          
                  val pending = pendingFolderResult ?: return
                  pendingFolderResult = null
                  val treeUri = if (resultCode == RESULT_OK) data?.data else null
                  if (treeUri == null) {
                      pending.success(mapOf(
                          "granted" to false,
                          "message" to "پوشه‌ای انتخاب نشد؛ برای ذخیرهٔ کلیپ باید یک پوشه را انتخاب کنی."
                      ))
                      return
                  }
          
                  try {
                      val flags = ((data?.flags ?: 0) and
                          (Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION))
                      if ((flags and Intent.FLAG_GRANT_WRITE_URI_PERMISSION) == 0) {
                          throw SecurityException("سیستم اجازهٔ نوشتن در پوشه را برنگرداند.")
                      }
                      contentResolver.takePersistableUriPermission(treeUri, flags)
          
                      val rootId = DocumentsContract.getTreeDocumentId(treeUri)
                      val rootName = queryDisplayName(treeUri, rootId) ?: "پوشهٔ انتخاب‌شده"
                      val raadId = if (rootName.equals(RAAD_FOLDER_NAME, ignoreCase = true)) {
                          rootId
                      } else {
                          findChildDocumentId(treeUri, rootId, RAAD_FOLDER_NAME, requireDirectory = true)
                              ?: createChildDirectory(treeUri, rootId, RAAD_FOLDER_NAME)
                      }
                      val displayName = if (raadId == rootId) rootName else "$rootName/$RAAD_FOLDER_NAME"
          
                      storagePrefs.edit()
                          .putString("treeUri", treeUri.toString())
                          .putString("folderDocumentId", raadId)
                          .putString("folderDisplayName", displayName)
                          .apply()
          
                      if (persistedTreeUri() == null || selectedFolderUri() == null) {
                          throw SecurityException("مجوز پوشه بعد از انتخاب به‌صورت پایدار ثبت نشد.")
                      }
                      pending.success(mapOf(
                          "granted" to true,
                          "folderName" to displayName,
                          "message" to "مجوز پایدار صادر شد. کلیپ‌ها در پوشهٔ $displayName ذخیره می‌شوند."
                      ))
                  } catch (error: Exception) {
                      storagePrefs.edit()
                          .remove("treeUri")
                          .remove("folderDocumentId")
                          .remove("folderDisplayName")
                          .apply()
                      pending.success(mapOf(
                          "granted" to false,
                          "message" to (error.message ?: "ثبت مجوز پایدار پوشه ناموفق بود.")
                      ))
                  }
              }
          
              private fun verifyFolderWritable(folderUri: Uri) {
                  val probeName = ".raad_write_check_${System.currentTimeMillis()}.tmp"
                  val probeUri = DocumentsContract.createDocument(
                      contentResolver,
                      folderUri,
                      "application/octet-stream",
                      probeName
                  ) ?: throw IOException("اندروید نتوانست فایل آزمایشی در پوشه بسازد.")
                  try {
                      val expected = "RAAD_STORAGE_WRITE_OK".toByteArray(Charsets.UTF_8)
                      contentResolver.openOutputStream(probeUri, "wt")?.use { output ->
                          output.write(expected)
                          output.flush()
                      } ?: throw IOException("نوشتن آزمایشی در پوشه ممکن نشد.")
                      val actual = contentResolver.openInputStream(probeUri)?.use {
                          it.readBytes()
                      } ?: throw IOException("خواندن فایل آزمایشی ممکن نشد.")
                      if (!expected.contentEquals(actual)) {
                          throw IOException("آزمون نوشتن و خواندن پوشه تأیید نشد.")
                      }
                  } finally {
                      try { contentResolver.delete(probeUri, null, null) } catch (_: Exception) {}
                  }
              }

              private fun queryDisplayName(treeUri: Uri, documentId: String): String? {
                  val documentUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, documentId)
                  var cursor: Cursor? = null
                  return try {
                      cursor = contentResolver.query(
                          documentUri,
                          arrayOf(DocumentsContract.Document.COLUMN_DISPLAY_NAME),
                          null,
                          null,
                          null
                      )
                      if (cursor != null && cursor.moveToFirst()) cursor.getString(0) else null
                  } finally {
                      cursor?.close()
                  }
              }
          
              private data class ChildDocument(
                  val id: String,
                  val name: String,
                  val mimeType: String
              )
          
              private fun childDocuments(treeUri: Uri, parentDocumentId: String): List<ChildDocument> {
                  val childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(
                      treeUri, parentDocumentId
                  )
                  var cursor: Cursor? = null
                  val result = mutableListOf<ChildDocument>()
                  try {
                      cursor = contentResolver.query(
                          childrenUri,
                          arrayOf(
                              DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                              DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                              DocumentsContract.Document.COLUMN_MIME_TYPE
                          ),
                          null,
                          null,
                          null
                      )
                      if (cursor != null) {
                          val idIndex = cursor.getColumnIndex(DocumentsContract.Document.COLUMN_DOCUMENT_ID)
                          val nameIndex = cursor.getColumnIndex(DocumentsContract.Document.COLUMN_DISPLAY_NAME)
                          val typeIndex = cursor.getColumnIndex(DocumentsContract.Document.COLUMN_MIME_TYPE)
                          while (cursor.moveToNext()) {
                              result.add(ChildDocument(
                                  cursor.getString(idIndex),
                                  cursor.getString(nameIndex),
                                  cursor.getString(typeIndex)
                              ))
                          }
                      }
                  } finally {
                      cursor?.close()
                  }
                  return result
              }
          
              private fun findChildDocumentId(
                  treeUri: Uri,
                  parentDocumentId: String,
                  name: String,
                  requireDirectory: Boolean
              ): String? {
                  return childDocuments(treeUri, parentDocumentId).firstOrNull {
                      it.name == name &&
                          (!requireDirectory || it.mimeType == DocumentsContract.Document.MIME_TYPE_DIR)
                  }?.id
              }
          
              private fun createChildDirectory(
                  treeUri: Uri,
                  parentDocumentId: String,
                  name: String
              ): String {
                  val parentUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, parentDocumentId)
                  val createdUri = DocumentsContract.createDocument(
                      contentResolver,
                      parentUri,
                      DocumentsContract.Document.MIME_TYPE_DIR,
                      name
                  ) ?: throw IOException("پوشهٔ RAAD در محل انتخاب‌شده ساخته نشد.")
                  return DocumentsContract.getDocumentId(createdUri)
              }
          
              private fun findFileUri(name: String): Uri? {
                  val treeUri = persistedTreeUri() ?: return null
                  val folderId = storagePrefs.getString(
                      "folderDocumentId", DocumentsContract.getTreeDocumentId(treeUri)
                  ) ?: return null
                  val child = childDocuments(treeUri, folderId).firstOrNull {
                      it.name == name && it.mimeType != DocumentsContract.Document.MIME_TYPE_DIR
                  } ?: return null
                  return DocumentsContract.buildDocumentUriUsingTree(treeUri, child.id)
              }
          
              private fun safeFileName(value: String): String =
                  File(value).name.replace(Regex("[^A-Za-z0-9._-]"), "_")
                      .ifBlank { "raad_clip_${System.currentTimeMillis()}.mp4" }
          
              private fun mimeFor(name: String): String {
                  return when (name.substringAfterLast('.', "").lowercase()) {
                      "mov" -> "video/quicktime"
                      "mkv" -> "video/x-matroska"
                      "webm" -> "video/webm"
                      "3gp" -> "video/3gpp"
                      else -> "video/mp4"
                  }
              }
          
              private fun countStream(stream: InputStream): Long {
                  var total = 0L
                  val buffer = ByteArray(1024 * 1024)
                  while (true) {
                      val count = stream.read(buffer)
                      if (count < 0) break
                      total += count.toLong()
                  }
                  return total
              }
          
              private fun querySize(uri: Uri): Long {
                  var cursor: Cursor? = null
                  try {
                      cursor = contentResolver.query(
                          uri,
                          arrayOf(DocumentsContract.Document.COLUMN_SIZE),
                          null,
                          null,
                          null
                      )
                      if (cursor != null && cursor.moveToFirst()) {
                          val index = cursor.getColumnIndex(DocumentsContract.Document.COLUMN_SIZE)
                          if (index >= 0 && !cursor.isNull(index)) {
                              val reportedSize = cursor.getLong(index)
                              // Some document providers return 0/-1 before refreshing metadata.
                              if (reportedSize > 0L) return reportedSize
                          }
                      }
                  } catch (_: Exception) {
                      // Some document providers omit metadata; count bytes by streaming below.
                  } finally {
                      cursor?.close()
                  }
                  contentResolver.openInputStream(uri)?.use { return countStream(it) }
                      ?: throw IOException("فایل ذخیره‌شده دوباره قابل‌خواندن نیست.")
              }
          
              private fun copyToDocument(source: File, targetUri: Uri): Long {
                  val output = contentResolver.openOutputStream(targetUri, "w")
                      ?: throw IOException("بازکردن فایل مقصد برای نوشتن ممکن نشد.")
                  var copied = 0L
                  FileInputStream(source).use { input ->
                      output.use { target -> copied = input.copyTo(target) }
                  }
                  return copied
              }
          
              private fun saveVideo(call: MethodCall, result: MethodChannel.Result) {
                  var createdUri: Uri? = null
                  try {
                      val sourcePath = call.argument<String>("sourcePath")
                          ?: throw IllegalArgumentException("مسیر ویدیوی مبدأ ارسال نشده است.")
                      val requestedName = call.argument<String>("fileName")
                          ?: throw IllegalArgumentException("نام فایل ارسال نشده است.")
                      val source = File(sourcePath)
                      if (!source.exists() || !source.isFile) {
                          throw IOException("فایل ویدیوی مبدأ دیگر در دسترس نیست.")
                      }
                      val expectedBytes = source.length()
                      if (expectedBytes <= 0L) throw IOException("فایل ویدیوی مبدأ خالی است.")
          
                      val treeUri = persistedTreeUri()
                          ?: throw SecurityException("دسترسی پوشهٔ ذخیره‌سازی صادر نشده است؛ پوشه را انتخاب کن.")
                      val folderUri = selectedFolderUri()
                          ?: throw SecurityException("پوشهٔ ذخیره‌سازی دیگر در دسترس نیست؛ دوباره انتخابش کن.")
                      val folderId = storagePrefs.getString(
                          "folderDocumentId", DocumentsContract.getTreeDocumentId(treeUri)
                      ) ?: DocumentsContract.getTreeDocumentId(treeUri)
          
                      val originalName = safeFileName(requestedName)
                      val dot = originalName.lastIndexOf('.')
                      val stem = if (dot > 0) originalName.substring(0, dot) else originalName
                      val ext = if (dot > 0) originalName.substring(dot) else ".mp4"
                      var name = originalName
                      var suffix = 1
                      while (findChildDocumentId(treeUri, folderId, name, false) != null) {
                          name = "${stem}_${suffix++}$ext"
                      }
          
                      createdUri = DocumentsContract.createDocument(
                          contentResolver, folderUri, mimeFor(name), name
                      ) ?: throw IOException("فایل جدید در پوشهٔ انتخاب‌شده ساخته نشد.")
          
                      val copied = copyToDocument(source, createdUri!!)
                      if (copied != expectedBytes) {
                          throw IOException("اندازهٔ کپی ناقص است؛ مبدأ=$expectedBytes مقصد=$copied")
                      }
                      val actualBytes = querySize(createdUri!!)
                      if (actualBytes != expectedBytes) {
                          throw IOException("تأیید اندازهٔ فایل ذخیره‌شده ناموفق بود؛ مبدأ=$expectedBytes مقصد=$actualBytes")
                      }
                      val folderDisplay = storagePrefs.getString("folderDisplayName", "RAAD") ?: "RAAD"
                      result.success(mapOf(
                          "uri" to createdUri.toString(),
                          "displayPath" to "$folderDisplay/$name",
                          "fileName" to name,
                          "bytes" to actualBytes
                      ))
                  } catch (error: Exception) {
                      createdUri?.let {
                          try { contentResolver.delete(it, null, null) } catch (_: Exception) {}
                      }
                      result.error(
                          "save_file_failed",
                          error.message ?: "ذخیرهٔ فایل ناموفق بود.",
                          null
                      )
                  }
              }
          
              private fun writeBackup(call: MethodCall, result: MethodChannel.Result) {
                  try {
                      val json = call.argument<String>("json")
                          ?: throw IllegalArgumentException("دادهٔ پشتیبان ارسال نشده است.")
                      val folderUri = selectedFolderUri()
                          ?: throw SecurityException("پوشهٔ پشتیبان انتخاب نشده است.")
                      val existing = findFileUri(BACKUP_FILE_NAME)
                      val target = existing ?: DocumentsContract.createDocument(
                          contentResolver, folderUri, "application/json", BACKUP_FILE_NAME
                      ) ?: throw IOException("ساخت فایل پشتیبان در پوشه ممکن نشد.")
                      contentResolver.openOutputStream(target, "wt")?.use { output ->
                          output.write(json.toByteArray(Charsets.UTF_8))
                          output.flush()
                      } ?: throw IOException("فایل پشتیبان برای نوشتن باز نشد.")
                      val verified = contentResolver.openInputStream(target)?.use {
                          it.readBytes().toString(Charsets.UTF_8)
                      } ?: throw IOException("خواندن دوبارهٔ فایل پشتیبان ناموفق بود.")
                      if (verified != json) throw IOException("تأیید فایل پشتیبان ناموفق بود.")
                      result.success(true)
                  } catch (error: Exception) {
                      result.error("backup_write_failed", error.message ?: "ذخیرهٔ پشتیبان ناموفق بود.", null)
                  }
              }
          
              private fun readBackup(result: MethodChannel.Result) {
                  try {
                      if (selectedFolderUri() == null) {
                          result.success(null)
                          return
                      }
                      val uri = findFileUri(BACKUP_FILE_NAME)
                      if (uri == null) {
                          result.success(null)
                          return
                      }
                      val json = contentResolver.openInputStream(uri)?.use {
                          it.readBytes().toString(Charsets.UTF_8)
                      }
                      result.success(json)
                  } catch (error: Exception) {
                      result.error("backup_read_failed", error.message ?: "خواندن پشتیبان ناموفق بود.", null)
                  }
              }
          
              private fun restoreVideoToPrivate(call: MethodCall, result: MethodChannel.Result) {
                  var target: File? = null
                  try {
                      val rawUri = call.argument<String>("uri")
                          ?: throw IllegalArgumentException("شناسهٔ فایل کلیپ ارسال نشده است.")
                      val targetPath = call.argument<String>("targetPath")
                          ?: throw IllegalArgumentException("مسیر کپی خصوصی ارسال نشده است.")
                      target = File(targetPath)
                      target.parentFile?.mkdirs()
                      val sourceUri = Uri.parse(rawUri)
                      val input = contentResolver.openInputStream(sourceUri)
                          ?: throw IOException("فایل کلیپ در پوشهٔ انتخاب‌شده پیدا نشد.")
                      val copied = input.use { inputStream ->
                          FileOutputStream(target!!).use { output -> inputStream.copyTo(output) }
                      }
                      if (copied <= 0L || target!!.length() != copied) {
                          throw IOException("تأیید کپی کلیپ به فضای داخلی ناموفق بود.")
                      }
                      result.success(mapOf("path" to target!!.absolutePath, "bytes" to copied))
                  } catch (error: Exception) {
                      target?.let { try { if (it.exists()) it.delete() } catch (_: Exception) {} }
                      result.error(
                          "restore_clip_failed",
                          error.message ?: "بازیابی کلیپ از فایل‌های گوشی ناموفق بود.",
                          null
                      )
                  }
              }
          
              private fun deleteSavedVideo(call: MethodCall, result: MethodChannel.Result) {
                  try {
                      val rawUri = call.argument<String>("uri")
                          ?: throw IllegalArgumentException("شناسهٔ فایل ذخیره‌شده موجود نیست.")
                      val uri = Uri.parse(rawUri)
                      val deleted = when (uri.scheme) {
                          "content" -> contentResolver.delete(uri, null, null) > 0
                          "file" -> uri.path?.let { File(it).delete() } ?: false
                          else -> false
                      }
                      result.success(deleted)
                  } catch (error: Exception) {
                      result.error("delete_file_failed", error.message ?: "حذف فایل ناموفق بود.", null)
                  }
              }
          }
          
          KOTLIN
          python - <<'PY'
          import re
          from pathlib import Path
          roots = Path("android/app/src/main/kotlin")
          files = list(roots.rglob("MainActivity.kt"))
          if len(files) != 1:
              raise SystemExit(f"Expected one generated MainActivity.kt, found {len(files)}")
          path = files[0]
          old = path.read_text(encoding="utf-8")
          match = re.search(r"^package\s+([A-Za-z0-9_.]+)", old, re.MULTILINE)
          if not match:
              raise SystemExit("Generated MainActivity.kt has no package declaration")
          template = Path("/tmp/raad-main-activity.kt").read_text(encoding="utf-8")
          template = template.replace("package __RAAD_PACKAGE__", "package " + match.group(1), 1)
          path.write_text(template, encoding="utf-8")
          print(f"Installed RAAD file-storage channel: {path}")
          PY

      - name: دریافت وابستگی‌ها
        working-directory: app
        run: flutter pub get

      - name: تحلیل کد Dart
        working-directory: app
        run: flutter analyze --no-pub

      - name: اجرای تست‌ها
        working-directory: app
        run: flutter test --no-pub

      - name: Configure persistent release signing
        id: signing
        working-directory: app
        shell: bash
        env:
          RAAD_KEYSTORE_BASE64: ${{ secrets.RAAD_KEYSTORE_BASE64 }}
          RAAD_KEYSTORE_PASSWORD: ${{ secrets.RAAD_KEYSTORE_PASSWORD }}
          RAAD_KEY_ALIAS: ${{ secrets.RAAD_KEY_ALIAS }}
          RAAD_KEY_PASSWORD: ${{ secrets.RAAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RAAD_KEYSTORE_BASE64}" || -z "${RAAD_KEYSTORE_PASSWORD}" || -z "${RAAD_KEY_ALIAS}" || -z "${RAAD_KEY_PASSWORD}" ]]; then
            echo "::warning::Persistent signing secrets are missing. Tests can pass, but no APK will be built or published until all four RAAD signing secrets are configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p android/app
          printf '%s' "$RAAD_KEYSTORE_BASE64" | base64 --decode > android/app/raad-release.keystore
          test -s android/app/raad-release.keystore
          chmod 600 android/app/raad-release.keystore
          keytool -list -keystore android/app/raad-release.keystore -storepass "$RAAD_KEYSTORE_PASSWORD" -alias "$RAAD_KEY_ALIAS" >/dev/null
          printf 'RAAD_KEYSTORE_PATH=%s\n' "$PWD/android/app/raad-release.keystore" >> "$GITHUB_ENV"
          printf 'RAAD_KEYSTORE_PASSWORD=%s\n' "$RAAD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'RAAD_KEY_ALIAS=%s\n' "$RAAD_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'RAAD_KEY_PASSWORD=%s\n' "$RAAD_KEY_PASSWORD" >> "$GITHUB_ENV"

          python - <<'PY'
          import re
          from pathlib import Path

          expected_id = "com.raad.mobile.raad"
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          gradle_path = kts if kts.exists() else groovy
          if not gradle_path.exists():
              raise SystemExit("Generated Android Gradle app file was not found.")

          source = gradle_path.read_text(encoding="utf-8")
          match = re.search(r'applicationId\s*(?:=\s*)?["\']([^"\']+)["\']', source)
          if match is None or match.group(1) != expected_id:
              actual = match.group(1) if match else "missing"
              raise SystemExit(f"Unexpected Android applicationId: {actual}; expected {expected_id}")

          if gradle_path.suffix == ".kts":
              if 'create("raadRelease")' not in source:
                  block = '''    signingConfigs {
                  create("raadRelease") {
                      storeFile = file(System.getenv("RAAD_KEYSTORE_PATH") ?: error("RAAD_KEYSTORE_PATH missing"))
                      storePassword = System.getenv("RAAD_KEYSTORE_PASSWORD") ?: error("RAAD_KEYSTORE_PASSWORD missing")
                      keyAlias = System.getenv("RAAD_KEY_ALIAS") ?: error("RAAD_KEY_ALIAS missing")
                      keyPassword = System.getenv("RAAD_KEY_PASSWORD") ?: error("RAAD_KEY_PASSWORD missing")
                  }
              }

              '''
                  if "    buildTypes {" not in source:
                      raise SystemExit("Could not locate buildTypes in Kotlin Gradle file.")
                  source = source.replace("    buildTypes {", block + "    buildTypes {", 1)
              old_signing = 'signingConfig = signingConfigs.getByName("debug")'
              if old_signing in source:
                  source = source.replace(old_signing, 'signingConfig = signingConfigs.getByName("raadRelease")', 1)
              else:
                  old_signing = "signingConfig = signingConfigs.debug"
                  if old_signing not in source:
                      raise SystemExit("Could not locate the generated release signingConfig in Kotlin Gradle file.")
                  source = source.replace(old_signing, 'signingConfig = signingConfigs.getByName("raadRelease")', 1)
          else:
              if "raadRelease {" not in source:
                  block = '''    signingConfigs {
                  raadRelease {
                      storeFile file(System.getenv("RAAD_KEYSTORE_PATH"))
                      storePassword System.getenv("RAAD_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("RAAD_KEY_ALIAS")
                      keyPassword System.getenv("RAAD_KEY_PASSWORD")
                  }
              }

              '''
                  if "    buildTypes {" not in source:
                      raise SystemExit("Could not locate buildTypes in Groovy Gradle file.")
                  source = source.replace("    buildTypes {", block + "    buildTypes {", 1)
              if "signingConfig signingConfigs.debug" in source:
                  source = source.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.raadRelease", 1)
              elif 'signingConfig signingConfigs.getByName("debug")' in source:
                  source = source.replace('signingConfig signingConfigs.getByName("debug")', "signingConfig signingConfigs.raadRelease", 1)
              else:
                  raise SystemExit("Could not locate the generated release signingConfig in Groovy Gradle file.")

          gradle_path.write_text(source, encoding="utf-8")
          print(f"Verified applicationId and configured persistent signing in {gradle_path}.")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: ساخت APK نسخه انتشار
        if: steps.signing.outputs.ready == 'true'
        working-directory: app
        run: flutter build apk --release --no-pub

      - name: Verify package ID and APK signature
        if: steps.signing.outputs.ready == 'true'
        working-directory: app
        shell: bash
        env:
          RAAD_KEYSTORE_PATH: ${{ github.workspace }}/app/android/app/raad-release.keystore
          RAAD_KEYSTORE_PASSWORD: ${{ secrets.RAAD_KEYSTORE_PASSWORD }}
          RAAD_KEY_ALIAS: ${{ secrets.RAAD_KEY_ALIAS }}
          RAAD_KEY_PASSWORD: ${{ secrets.RAAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          [[ -n "$apksigner" && -n "$aapt" ]] || { echo "Android signing/manifest tools not found." >&2; exit 1; }

          # Re-sign the final APK explicitly with the persistent release key.
          # This avoids depending on Flutter/Gradle's default release signing choice.
          signed_apk="${apk%.apk}.raad-signed.apk"
          "$apksigner" sign \
            --ks "$RAAD_KEYSTORE_PATH" \
            --ks-key-alias "$RAAD_KEY_ALIAS" \
            --ks-pass env:RAAD_KEYSTORE_PASSWORD \
            --key-pass env:RAAD_KEY_PASSWORD \
            --out "$signed_apk" "$apk"
          mv "$signed_apk" "$apk"
          "$apksigner" verify --verbose "$apk"

          expected="$(
            keytool -exportcert -keystore "$RAAD_KEYSTORE_PATH" -storepass "$RAAD_KEYSTORE_PASSWORD" -alias "$RAAD_KEY_ALIAS" |
            sha256sum | awk '{print tolower($1)}'
          )"
          actual="$(
            "$apksigner" verify --print-certs "$apk" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest/ {gsub(/:/, "", $2); print tolower($2); exit}'
          )"
          echo "Signing certificate fingerprint comparison: keystore=$expected apk=$actual"
          package_name="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          [[ -n "$expected" && "$expected" == "$actual" ]] || { echo "APK signing certificate does not match the persistent key." >&2; exit 1; }
          [[ "$package_name" == "com.raad.mobile.raad" ]] || { echo "Unexpected APK package ID: $package_name" >&2; exit 1; }
          echo "Verified stable package ID and matching APK certificate."
      - name: تعیین تگ نسخهٔ انتشار
        if: steps.signing.outputs.ready == 'true'
        id: release_tag
        working-directory: app
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'tag_name=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            version="$(sed -nE 's/^version:[[:space:]]*([^+]+)\+.*/\1/p' pubspec.yaml)"
            if [[ -z "$version" ]]; then
              echo "Could not read app version from pubspec.yaml" >&2
              exit 1
            fi
            printf 'tag_name=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          fi

      - name: بارگذاری APK به‌عنوان artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: raad-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: انتشار فایل نصب در GitHub Releases
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          target_commitish: main
          name: RAAD ${{ steps.release_tag.outputs.tag_name }}
          generate_release_notes: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
